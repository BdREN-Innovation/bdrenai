<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f4f6f7;font-family:Inter,Arial,sans-serif;color:#0f2427;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;">
    <tr><td style="padding:32px;">
      <p style="margin:0 0 16px;font-size:16px;">Hello,</p>
      <p style="margin:0 0 24px;font-size:16px;line-height:1.5;">We received your payment for BDREN AI. Thank you.</p>
      <table role="presentation" cellspacing="0" cellpadding="0" style="font-size:15px;line-height:1.6;">
        <tr><td style="padding-right:16px;color:#5b6b6d;">Receipt</td><td>{{ number }}</td></tr>
        <tr><td style="padding-right:16px;color:#5b6b6d;">Amount</td><td><strong>{{ amount }}</strong></td></tr>
        <tr><td style="padding-right:16px;color:#5b6b6d;">Package</td><td>{{ package }}</td></tr>
        {% if period %}<tr><td style="padding-right:16px;color:#5b6b6d;">Period</td><td>{{ period }}</td></tr>{% endif %}
        <tr><td style="padding-right:16px;color:#5b6b6d;">Method</td><td>{{ method }}</td></tr>
        {% if reference %}<tr><td style="padding-right:16px;color:#5b6b6d;">Reference</td><td>{{ reference }}</td></tr>{% endif %}
      </table>
      <p style="margin:24px 0 0;font-size:14px;line-height:1.5;color:#5b6b6d;">You can see this receipt in your institution console.</p>
    </td></tr>
  </table>
</body>
</html>
