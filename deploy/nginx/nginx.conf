worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  client_max_body_size 10m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_content_type $is_grpc { default 0; ~^application/grpc 1; }

  log_format main '$remote_addr $host "$request" $status $body_bytes_sent rt=$request_time';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # Rate limit for the login UI / token endpoints (login abuse protection, layer 1;
  # ZITADEL has its own lockout policy as layer 2).
  limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/s;

  server {
    listen 80 default_server;
    server_name _;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location / { return 404; }
  }

  include /etc/nginx/conf.d/*.conf;
}
